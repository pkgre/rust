schema = 1

# crates.io owners expected on every crate this workflow publishes.
owners = ["sorpaas"]

# A self-publishing repository: its releases also go to crates.io.
[[repositories]]
git = "https://github.com/pkgre/pkgre"
tag-prefix = "rust/v"

[[repositories]]
git = "https://github.com/rust-ethereum/evm"
tag-prefix = "v"
manifests = "crates-io"

[[repositories]]
git = "https://github.com/rust-ethereum/evm-legacy"
tag-prefix = "v"
manifests = "crates-io"

# Optional crates.io names; other crates get "pkgre-pkgs-" + name.
[names]
pkgre = "pkgre"
