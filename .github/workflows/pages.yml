name: Validate registry

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out registry catalog
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out pinned indexer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pkgre/pkgre
          ref: 8fb68d277cf2bda6c2688c533330a66cab5e7dca
          path: tooling
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build pinned indexer
        run: nix build --print-build-logs ./tooling#indexer
      - name: Require fully applied admissions
        run: ./result/bin/pkgre-rust check registry
      - name: Require converged catalog
        run: |
          ./result/bin/pkgre-rust lock registry
          changes="$(git status --porcelain=v1 --untracked-files=all -- registry)"
          if [[ -n "$changes" ]]; then
            printf '%s\n' "$changes" >&2
            echo "registry is not fully applied and converged; run pkgre-rust lock and commit every result" >&2
            exit 1
          fi
