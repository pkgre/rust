schema = 5

[registry]
name = "main"
index = "sparse+https://rust.pkg.re/"
download = "https://rust.pkg.re/v1/main/{crate}/{version}/{sha256-checksum}"
cargo-version = "1.95.0"
audience = "public"
delivery = "retained"

[categories.acp]
may-depend-on = ["main/acp", "main/general"]

[categories.acp.mirror]
agent-client-protocol = ["2.0.0"]
agent-client-protocol-derive = ["2.0.0"]
agent-client-protocol-schema = ["1.5.0"]

[categories.filesystem]
may-depend-on = ["main/filesystem", "main/general"]

[categories.filesystem.mirror]
notify = ["8.2.0"]
notify-types = ["2.1.0"]

[categories.general]
file = "categories/main/general.toml"

[categories.matrix]
file = "categories/main/matrix.toml"

[categories.mcp]
may-depend-on = ["main/general", "main/mcp", "main/sse"]

[categories.mcp.mirror]
rmcp = ["1.4.0", "1.8.0"]
rmcp-macros = ["1.4.0", "1.8.0"]

[categories.pkgre]
may-depend-on = ["main/general", "main/pkgre"]

[categories.pkgre.publish.pkgre-indexer]
git = "https://github.com/pkgre/pkgre"
tags = ["indexer/v0.1.1", "indexer/v0.2.0", "indexer/v0.3.0"]

[categories.sse]
may-depend-on = ["main/general", "main/sse"]

[categories.sse.mirror]
eventsource-stream = ["0.2.3"]
sse-stream = ["0.2.1", "0.2.5"]

[categories.terminal]
may-depend-on = ["main/general", "main/terminal"]

[categories.terminal.mirror]
atty = ["0.2.14"]
portable-pty = ["0.9.0"]

[categories.yaml]
may-depend-on = ["main/general", "main/yaml"]

[categories.yaml.mirror]
serde_yaml = ["0.9.34+deprecated"]
serde_yaml_ng = ["0.10.0"]

