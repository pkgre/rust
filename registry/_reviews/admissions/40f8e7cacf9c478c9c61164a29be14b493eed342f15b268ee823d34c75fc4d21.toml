note = "Full-archive review approved for nohash-hasher 0.2.0, crates.io archive SHA-256 2bf50223579dc7cdcfb3bfcacf7069ff68243f8c363f62ffa99cf000a6b9c451. Reviewed all nine regular archive members: Cargo manifests, VCS metadata, editor/Git metadata, Apache-2.0 and MIT licenses, README, and src/lib.rs. The archive has no executable files, binary members, dependencies, build script, procedural macro, native link declaration, separate binary/example/bench target, unsafe code, process spawning, filesystem/network/environment access, or bundled generated binary data. It is a small no_std-capable integer identity-hasher library with an optional default std feature. Its material inherent risk is deliberate absence of real hashing: untrusted or unsuitable key domains can cause collisions or denial of service, and custom IsEnabled implementations must uphold the documented one-integer-write invariant; this is accepted because that behavior and constraint are the package's explicit, compact, fully reviewed purpose. The new package is permanently routed to universe/general; it adds no dependency edges, so category policy is satisfied. crates.io identifies publisher twittner (account 2332) and repository https://github.com/paritytech/nohash-hasher; the archive's embedded commit 99b021664e9d7fd3e1f7ffb8633a137e21e12149 corresponded exactly to the publisher-asserted repository source under the indexer's Cargo-publication normalization. No Trusted Publishing attestation is present for this 2020 release. The dual Apache-2.0 OR MIT declaration matches the included license texts. No unexplained metadata, file, mode, checksum, source, or build-surface discrepancy was found."
