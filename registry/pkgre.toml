schema = 2

[registry]
name = "pkgre"
index = "sparse+https://rust.pkg.re/pkgre/"
download = "https://rust.pkg.re/crates/{sha256-checksum}.crate"
may-depend-on = [
    "core",
    "matrix",
    "pkgre",
]
cargo-version = "1.95.0"

[mirror]

[publish.pkgre-indexer]
git = "https://github.com/pkgre/pkgre"
tags = [
    "indexer/v0.1.1",
    "indexer/v0.2.0",
]
